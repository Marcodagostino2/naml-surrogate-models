study:
  n_trials: 5
  timeout: 5400
  direction: minimize
  metric: val_rmse
  sampler: tpe
  pruner: median
  n_startup_trials: 5
  n_warmup_steps: 15
  pruner_interval: 5
  log_every_n_trials: 5

training_overrides:
  n_training_steps: 2000

architecture_name: "non_stationary"  # options: "non_stationary" | "dkl"

# Kernel selection for optimization
# - Non-stationary: always uses "exponential" (Gibbs kernel)
# - DKL: supports "exponential" | "rbf" | "matern"
kernel_name: "exponential"   # override as needed

search_spaces:
  non_stationary:
    model:
      block1_layers:
        type: int
        low: 1
        high: 3
      block1_hidden_size:
        type: categorical
        choices: [16, 32, 64, 128, 256, 512, 1024]
      block1_activation:
        type: categorical
        choices: [relu, tanh]
      block2_layers:
        type: int
        low: 1
        high: 3
      block2_hidden_size:
        type: categorical
        choices: [16, 32, 64, 128, 256, 512, 1024]
      block2_activation:
        type: categorical
        choices: [relu, tanh]
      block3_layers:
        type: int
        low: 1
        high: 3
      block3_hidden_size:
        type: categorical
        choices: [16, 32, 64, 128, 256, 512, 1024]
      block3_activation:
        type: categorical
        choices: [relu, tanh]
      dropout:
        type: float
        low: 0.0
        high: 0.0
      power_exponent_init:
        type: float
        low: 1.5
        high: 2.0
      theta_init:
        type: float
        low: 1.0e-3
        high: 1.0
        log: true
      likelihood_noise_init:
        type: float
        low: 1.0e-5
        high: 1.0
        log: true
    training:
      mlp_learning_rate:
        type: float
        low: 1.0e-5
        high: 1.0
        log: true
      gp_learning_rate:
        type: float
        low: 1.0e-5
        high: 1.0
        log: true
      mlp_weight_decay:
        type: float
        low: 1.0e-6
        high: 1.0
        log: true

  dkl:
    model:
      block1_layers:
        type: int
        low: 1
        high: 3
      block1_hidden_size:
        type: categorical
        choices: [16, 32, 64, 128, 256, 512, 1024]
      block1_activation:
        type: categorical
        choices: [relu, tanh]
      block2_layers:
        type: int
        low: 1
        high: 3
      block2_hidden_size:
        type: categorical
        choices: [16, 32, 64, 128, 256, 512, 1024]
      block2_activation:
        type: categorical
        choices: [relu, tanh]
      block3_layers:
        type: int
        low: 1
        high: 3
      block3_hidden_size:
        type: categorical
        choices: [16, 32, 64, 128, 256, 512, 1024]
      block3_activation:
        type: categorical
        choices: [relu, tanh]
      dropout:
        type: float
        low: 0.0
        high: 0.0
      batch_norm:
        type: categorical
        choices: [false]
      output_width:
        type: int
        low: 1
        high: 15
      output_activation:
        type: categorical
        choices: [identity]
      theta_init:
        type: float
        low: 1.0e-3
        high: 1.0
        log: true
      power_exponent_init:
        type: float
        low: 1.5
        high: 2.0
      tau2_init:
        type: float
        low: 1.0e-4
        high: 1.0e+1
        log: true
      likelihood_noise_init:
        type: float
        low: 1.0e-5
        high: 1.0
        log: true
    training:
      mlp_learning_rate:
        type: float
        low: 1.0e-5
        high: 1.0e-1
        log: true
      gp_learning_rate:
        type: float
        low: 1.0e-5
        high: 1.0e-1
        log: true
      mlp_weight_decay:
        type: float
        low: 1.0e-6
        high: 1.0e-1
        log: true
