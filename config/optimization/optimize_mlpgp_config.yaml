study:
  n_trials: 150
  timeout: 5400
  direction: minimize
  metric: val_rmse
  sampler: tpe
  pruner: median
  n_startup_trials: 5
  n_warmup_steps: 15
  pruner_interval: 5
  log_every_n_trials: 5

training_overrides:
  n_training_steps: 2000

architecture_name: "non_stationary"  # "non_stationary" | "dkl"

# Kernel for the GP head:
# - Non-stationary: must be "exponential" (Gibbs kernel).
# - DKL: any of "exponential" | "rbf" | "matern".
kernel_name: "exponential"

# Hidden anchor host: not consumed by the loader, only referenced below.
# Both architectures share the same single-block search: depth (n_layers),
# per-layer width via the layer_size template (sampled n_layers times at
# trial time), activation, dropout. Init is fixed per activation.
_shared:
  block: &block
    n_layers:
      type: int
      low: 1
      high: 5
    layer_size:
      type: categorical
      choices: [16, 32, 64, 128, 256, 512, 1024]
    activation:
      type: categorical
      choices: [relu, leaky_relu, selu, tanh, mish]
    dropout:
      type: float
      low: 0.0
      high: 0.0

search_spaces:
  non_stationary:
    model:
      <<: *block
      power_exponent_init:
        type: categorical
        choices: [1.5, 1.6, 1.7, 1.8, 1.9, 2.0]
      theta_init:
        type: categorical
        choices: [1.0e-3, 1.0e-2, 1.0e-1, 1.0]
      likelihood_noise_init:
        type: categorical
        choices: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
      trend_degree:
        type: int
        low: 0
        high: 3
    training:
      mlp_learning_rate:
        type: categorical
        choices: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
      gp_learning_rate:
        type: categorical
        choices: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
      mlp_weight_decay:
        type: categorical
        choices: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]

  dkl:
    model:
      <<: *block
      batch_norm:
        type: categorical
        choices: [false]
      output_width:
        type: int
        low: 1
        high: 5
      output_activation:
        type: categorical
        choices: [identity]
      theta_init:
        type: categorical
        choices: [1.0e-3, 1.0e-2, 1.0e-1, 1.0]
      power_exponent_init:
        type: categorical
        choices: [1.5, 1.6, 1.7, 1.8, 1.9, 2.0]
      tau2_init:
        type: categorical
        choices: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0, 1.0e+1]
      likelihood_noise_init:
        type: categorical
        choices: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
      trend_degree:
        type: int
        low: 0
        high: 3
    training:
      mlp_learning_rate:
        type: categorical
        choices: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
      gp_learning_rate:
        type: categorical
        choices: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
      mlp_weight_decay:
        type: categorical
        choices: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]