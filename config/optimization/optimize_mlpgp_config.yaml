study:
  n_trials: 5
  timeout: 5400
  direction: minimize
  metric: val_rmse
  sampler: tpe
  pruner: median
  n_startup_trials: 5
  n_warmup_steps: 15
  pruner_interval: 5
  log_every_n_trials: 5

training_overrides:
  n_training_steps: 250

search_space:
  model:
    hidden_layers:
      type: int
      low: 1
      high: 4
    hidden_size:
      type: categorical
      choices: [32, 64, 128, 256]
    activation:
      type: categorical
      choices: [relu, tanh, gelu]
    dropout:
      type: float
      low: 0.0
      high: 0.3
    lengthscale_init:
      type: float
      low: 0.01
      high: 0.01
      log: true
    noise_var:
      type: float
      low: 1.0e-5
      high: 1.0e-5
      log: true
  training:
    learning_rate:
      type: float
      low: 1.0e-4
      high: 1.0e-4
      log: true
    weight_decay:
      type: float
      low: 1.0e-6
      high: 1.0e-5
      log: true
