study:
  n_trials: 5
  timeout: 5400
  direction: minimize
  metric: val_rmse
  sampler: tpe
  pruner: median
  n_startup_trials: 5
  n_warmup_steps: 15
  pruner_interval: 5
  log_every_n_trials: 5

training_overrides:
  n_training_steps: 2000

architecture_name: "non_stationary"  # "non_stationary" | "dkl"

# Kernel for the GP head:
# - Non-stationary: must be "exponential" (Gibbs kernel).
# - DKL: any of "exponential" | "rbf" | "matern".
kernel_name: "exponential"

# Hidden anchor host: not consumed by the loader, only referenced below.
# Both architectures share the same single-block search (depth + per-layer
# width + activation + dropout); init is fixed per activation.
_shared:
  block: &block
    n_layers:
      type: int
      low: 3
      high: 9
    layer1_size: &layer_size
      type: categorical
      choices: [16, 32, 64, 128, 256, 512, 1024]
    layer2_size: *layer_size
    layer3_size: *layer_size
    layer4_size: *layer_size
    layer5_size: *layer_size
    layer6_size: *layer_size
    activation:
      type: categorical
      choices: [relu, leaky_relu, selu, tanh, mish]
    dropout:
      type: float
      low: 0.0
      high: 0.0

search_spaces:
  non_stationary:
    model:
      <<: *block
      power_exponent_init:
        type: float
        low: 1.5
        high: 2.0
      theta_init:
        type: float
        low: 1.0e-3
        high: 1.0
        log: true
      likelihood_noise_init:
        type: float
        low: 1.0e-5
        high: 1.0
        log: true
      trend_degree:
        type: int
        low: 0
        high: 3
    training:
      mlp_learning_rate:
        type: float
        low: 1.0e-5
        high: 1.0
        log: true
      gp_learning_rate:
        type: float
        low: 1.0e-5
        high: 1.0
        log: true
      mlp_weight_decay:
        type: float
        low: 1.0e-6
        high: 1.0
        log: true

  dkl:
    model:
      <<: *block
      batch_norm:
        type: categorical
        choices: [false]
      output_width:
        type: int
        low: 1
        high: 15
      output_activation:
        type: categorical
        choices: [identity]
      theta_init:
        type: float
        low: 1.0e-3
        high: 1.0
        log: true
      power_exponent_init:
        type: float
        low: 1.5
        high: 2.0
      tau2_init:
        type: float
        low: 1.0e-4
        high: 1.0e+1
        log: true
      likelihood_noise_init:
        type: float
        low: 1.0e-5
        high: 1.0
        log: true
      trend_degree:
        type: int
        low: 0
        high: 3
    training:
      mlp_learning_rate:
        type: float
        low: 1.0e-5
        high: 1.0e-1
        log: true
      gp_learning_rate:
        type: float
        low: 1.0e-5
        high: 1.0e-1
        log: true
      mlp_weight_decay:
        type: float
        low: 1.0e-6
        high: 1.0e-1
        log: true