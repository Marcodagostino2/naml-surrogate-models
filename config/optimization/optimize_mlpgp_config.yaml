study:
  n_trials: 50
  timeout: 5400
  direction: minimize
  metric: val_rmse
  sampler: tpe
  pruner: median
  n_startup_trials: 5
  n_warmup_steps: 15
  pruner_interval: 5
  log_every_n_trials: 5

training_overrides:
  n_training_steps: 250

search_space:
  model:
    block1_layers:
      type: int
      low: 2
      high: 4
    block1_hidden_size:
      type: categorical
      choices: [128, 256, 512]
    block1_activation:
      type: categorical
      choices: [relu, tanh, sigmoid]
    block2_layers:
      type: int
      low: 2
      high: 4
    block2_hidden_size:
      type: categorical
      choices: [64, 128, 256]
    block2_activation:
      type: categorical
      choices: [relu, tanh, sigmoid]
    block3_layers:
      type: int
      low: 2
      high: 4
    block3_hidden_size:
      type: categorical
      choices: [32, 64, 128]
    block3_activation:
      type: categorical
      choices: [relu, tanh, sigmoid]
    dropout:
      type: float
      low: 0.0
      high: 0.1
    lengthscale_init:
      type: float
      low: 1.0e-2
      high: 1.0e-1
      log: true
    noise_var:
      type: float
      low: 1.0e-4
      high: 1.0e-1
      log: true
  training:
    mlp_learning_rate:
      type: float
      low: 1.0e-5
      high: 1.0e-1
      log: true
    gp_learning_rate:
      type: float
      low: 1.0e-5
      high: 1.0e-1
      log: true
    mlp_weight_decay:
      type: float
      low: 1.0e-6
      high: 1.0e-3
      log: true
