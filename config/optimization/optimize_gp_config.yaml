study:
  n_trials: 50
  timeout: 7200
  direction: minimize
  metric: val_rmse
  sampler: gp
  pruner: null
  n_startup_trials: 5
  log_every_n_trials: 3

training_overrides:
  n_training_steps: 500

# Kernel selection for optimization
# Supported: "exponential" | "rbf" | "matern"
kernel_name: "exponential"   # override in command line or env as needed

search_space:
  model:
    outputscale_init:
      type: float
      low: 1.0e-3
      high: 1.0e-1
      log: true
    lengthscale_init:
      type: float
      low: 1.0e-2
      high: 1.0
      log: true
    noise_var:
      type: float
      low: 1.0e-5
      high: 1.0e-1
      log: true
  training:
    learning_rate:
      type: float
      low: 1.0e-5
      high: 1.0e-1
      log: true
