study:
  n_trials: 20
  timeout: 7200
  direction: minimize
  metric: val_rmse
  sampler: tpe
  pruner: null
  n_startup_trials: 5
  log_every_n_trials: 3

training_overrides:
  n_training_steps: 2000

# Kernel selection for optimization
# Supported: "exponential" | "rbf" | "matern"
kernel_name: "exponential"   # override in command line or env as needed

search_space:
  model:
    tau2_init:
      type: categorical
      choices: [1.0e-3, 1.0e-2, 1.0e-1, 1.0]
    theta_init:
      type: categorical
      choices: [1.0e-3, 1.0e-2, 1.0e-1, 1.0]
    power_exponent_init:
      type: categorical
      choices: [1.5, 1.6, 1.7, 1.8, 1.9, 2.0]
    likelihood_noise_init:
      type: categorical
      choices: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
    trend_degree:
      type: int
      low: 0
      high: 3
  training:
    learning_rate:
      type: categorical
      choices: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
