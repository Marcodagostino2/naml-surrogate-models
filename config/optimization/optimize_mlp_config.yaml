study:
  n_trials: 50
  timeout: 3600        
  direction: minimize
  metric: val_rmse      # val_rmse | val_mae | val_nll
  sampler: tpe         
  pruner: median       
  n_startup_trials: 5  
  log_every_n_trials: 5
  n_warmup_steps: 20   # number of warmup steps for the pruner
  pruner_interval: 5   # interval (in epochs) at which the pruner checks for pruning
  # For Hyperband pruner, specify the following additional parameters:
  min_resource: 10     # minimum number of epochs to run a trial before it can be pruned
  max_resource: 300    # maximum number of epochs to run a trial
  reduction_factor: 3  # reduction factor for Hyperband (how aggressively to prune trials)

training_overrides:
  n_epochs: 2000

search_space:
  model:
    block1_layers:
      type: int
      low: 1
      high: 3
    block1_hidden_size:
      type: categorical
      choices: [16, 32, 64, 128, 256, 512, 1024]
    block1_activation:
      type: categorical
      choices: [relu, tanh]
    block2_layers:
      type: int
      low: 1
      high: 3
    block2_hidden_size:
      type: categorical
      choices: [16, 32, 64, 128, 256, 512, 1024]
    block2_activation:
      type: categorical
      choices: [relu, tanh]
    block3_layers:
      type: int
      low: 1
      high: 3
    block3_hidden_size:
      type: categorical
      choices: [16, 32, 64, 128, 256, 512, 1024]
    block3_activation:
      type: categorical
      choices: [relu, tanh]
    dropout:
      type: float
      low: 0.0
      high: 0.4
  training:
    learning_rate:
      type: float
      low: 1.0e-5
      high: 1.0e-2
      log: true
    weight_decay:
      type: float
      low: 1.0e-6
      high: 1.0e-1
      log: true
