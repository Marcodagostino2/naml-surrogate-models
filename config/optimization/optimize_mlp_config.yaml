study:
  n_trials: 2
  timeout: 3600
  direction: minimize
  metric: val_rmse        # val_rmse | val_mae | val_nll
  sampler: tpe
  pruner: median
  n_startup_trials: 25
  log_every_n_trials: 5
  n_warmup_steps: 20      # warmup steps for the pruner
  pruner_interval: 5      # interval (in epochs) at which the pruner checks
  # Hyperband-only:
  min_resource: 10
  max_resource: 300
  reduction_factor: 3

training_overrides:
  n_epochs: 50

# Single-block MLP: choose depth (n_layers), per-layer width (layer_size
# template applied dynamically — at trial time exactly n_layers width
# params are sampled), and one activation shared across the block. Init
# is fixed per activation (see src/models/init.py).
search_space:
  model:
    n_layers:
      type: int
      low: 2
      high: 6
    layer_size:
      type: categorical
      choices: [32, 64, 128, 256, 512]
    activation:
      type: categorical
      choices: [relu, tanh, mish]
    dropout:
      type: float
      low: 0.0
      high: 0.0
  training:
    learning_rate:
      type: categorical
      choices: [1.0e-3, 1.0e-2, 1.0e-1]
    weight_decay:
      type: categorical
      choices: [1.0e-3, 1.0e-2]
