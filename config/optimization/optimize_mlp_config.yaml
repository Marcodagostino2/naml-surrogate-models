study:
  n_trials: 50
  timeout: 3600
  direction: minimize
  metric: val_rmse        # val_rmse | val_mae | val_nll
  sampler: tpe
  pruner: median
  n_startup_trials: 5
  log_every_n_trials: 5
  n_warmup_steps: 20      # warmup steps for the pruner
  pruner_interval: 5      # interval (in epochs) at which the pruner checks
  # Hyperband-only:
  min_resource: 10
  max_resource: 300
  reduction_factor: 3

training_overrides:
  n_epochs: 2000

# Single-block MLP: choose depth (n_layers), per-layer width (layer{i}_size,
# i in [1, n_layers]; entries past n_layers are ignored), and one activation
# shared across the block. Init is fixed per activation (see src/models/init.py).
search_space:
  model:
    n_layers:
      type: int
      low: 3
      high: 9
    layer1_size: &layer_size
      type: categorical
      choices: [16, 32, 64, 128, 256, 512, 1024]
    layer2_size: *layer_size
    layer3_size: *layer_size
    layer4_size: *layer_size
    layer5_size: *layer_size
    layer6_size: *layer_size
    activation:
      type: categorical
      choices: [relu, leaky_relu, selu, tanh, mish]
    dropout:
      type: float
      low: 0.0
      high: 0.4
  training:
    learning_rate:
      type: float
      low: 1.0e-5
      high: 1.0e-2
      log: true
    weight_decay:
      type: float
      low: 1.0e-6
      high: 1.0e-1
      log: true