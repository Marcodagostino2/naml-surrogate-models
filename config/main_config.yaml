# ============================================================================
# Main Configuration Orchestrator
# ============================================================================
# This file controls the overall experiment run: which model to train, random
# seed, execution mode, and precision settings. Specific model/training 
# configs are loaded dynamically based on the 'model_to_train' selection.

# Global random seed for reproducibility
global_seed: 21

# PyTorch default precision: "float32" or "float64"
# All tensors and models will use this precision unless explicitly overridden
precision: "float32"

# Active dataset key from config/dataset/dataset_config.yaml
dataset: "airfoil_self_noise"

# Model selection: "mlp", "gp", "mlpgp", or "all"
model_to_train: "gp"

# Execution mode: "training", "test", or "training+test"
run_mode: "training"

# Verbose logging
verbose: true
