# Workflow mode: "single_run" | "optimization" | "convergence"
mode: "convergence"
global_seed: 21
# "float32" or "float64"
precision: "float64"
# Key in config/dataset/dataset_config.yaml
dataset: "AEDB_v1"
# "mlp" | "gp" | "mlpgp" | "all"
model_to_train: "all"
# single_run sub-mode: "training" | "test" | "training+test"
run_mode: "training"
verbose: true
