# Workflow mode: "single_run" | "convergence" (HPO lives inside convergence).
mode: "single_run"
global_seed: 21
# "float32" or "float64"
precision: "float32"
# Key in config/dataset/dataset_config.yaml
dataset: "HYDDB_v3"
# List of canonical models: any subset of [mlp, gp, mlpgp_ns, mlpgp_dkl]; "all" is an alias for the full set.
models_to_train: ["gp"]
# single_run sub-mode: "training" | "test" | "training+test"
run_mode: "training"
verbose: true
