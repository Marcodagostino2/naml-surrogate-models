      x20, x21, x22, x23, x24, x25]
    target_columns: [y]
    dropna: true
    normalize_inputs: true
    normalize_targets: true
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    batch_size: 64
