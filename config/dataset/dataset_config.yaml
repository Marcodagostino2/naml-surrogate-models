# ============================================================================
# Dataset Configuration
# ============================================================================
# Shared configuration for data loading, preprocessing, and splitting.
# Works for all three models (MLP, GP, MLP+GP).

# Data source
csv_path: "data/HYDDB_v2_output.csv"

# Input features to use
input_columns:
  - sim_machNumberValue
  - sim_aoaValue
  - sim_phiValue
  - sim_altitudeValue
  - geom_abk_openingPercentage

# Target output columns
target_columns:
  - cfd_cfx_mean

# Data cleaning
dropna: true

# Data splitting proportions
train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15

# Normalization
normalize_inputs: true
normalize_targets: true

# DataLoader settings
batch_size: 32
num_workers: 0
pin_memory: false
