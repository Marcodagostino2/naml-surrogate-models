# ============================================================================
# Hybrid MLP+Kriging Model Configuration
# ============================================================================
# Explicit MLPGP configuration.
#
# Architectures:
#   - "non_stationary": MLP predicts local sigma(x) and lengthscale l(x) — requires exponential kernel
#   - "dkl": Deep Kernel Learning — MLP learns low-dim representation for GP kernel
#
# feature_extractor controls the MLP that outputs local kernel parameters:
#   - sigma(x): local amplitude factor
#   - l(x): local lengthscale (scalar or per-dimension)
#
# kernel specifies the kernel type and its hyperparameters:
#   - type: "exponential" (required for non_stationary) or "exponential", "rbf", "matern" for dkl
#   - theta, power_exponent (for exponential)
#   - matern_nu (for matern)

architecture_name: "non_stationary"   # "dkl" for Deep Kernel Learning, "non_stationary" 

dkl_feature_extractor:
  name: "dkl"
  architecture:
    - layers: [1000, 500, 50, 10]
      activation: "tanh"
  dropout: 0.0
  batch_norm: false
  output_width: 8
  output_activation: "identity"

non_stationary_feature_extractor:
  name: "non_stationary"
  architecture:
    - layers: [1024, 1024, 1024]
      activation: "tanh"
    - layers: [128]
      activation: "tanh"
    - layers: [256]
      activation: "tanh"    
  dropout: 0.0
  batch_norm: false
  output_activation: "identity"
  log_sigma_floor: -4
  log_sigma_ceiling: 3
  log_lengthscale_floor: -4
  log_lengthscale_ceiling: 3
  lengthscale_mode: "per_dimension"

kernel:
  type: "exponential"      # options: "exponential" | "rbf" | "matern"
                           # Note: "exponential" is mandatory for non_stationary architecture
  theta_init: 1.0e-1            # exponential only
  power_exponent_init: 1.9      # exponential only
  likelihood_noise_init: 1.0e-2
  tau2_init: 1.0e-2             # outputscale (DKL only; non_stationary ignores this)
  matern_nu: 2.5           # matern only (0.5, 1.5, 2.5)
  likelihood_noise_floor: 1.0e-6      # minimum noise level
  likelihood_noise_ceiling: 1.0       # maximum noise level 
  theta_floor: 1.0e-5      # minimum theta value 
  theta_ceiling: 1.0e3     # maximum theta value 
  power_exponent_floor: 1.5  # minimum power exponent
  power_exponent_ceiling: 2.0  # maximum power exponent

trend_degree: 1
