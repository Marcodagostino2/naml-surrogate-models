# ============================================================================
# Hybrid MLP+Kriging Model Configuration
# ============================================================================
# Explicit MLPGP configuration.
#
# feature_extractor controls the MLP that outputs local kernel parameters:
#   - sigma(x): local amplitude factor
#   - l(x): local lengthscale (scalar or per-dimension)
#
# kernel keeps the stationary kernel hyperparameters separate and explicit:
#   - theta
#   - power_exponent

architecture_name: "non_stationary"   # "dkl" for Deep Kernel Learning, "non_stationary" 

dkl_feature_extractor:
  name: "dkl"
  architecture:
    - layers: [256, 256, 256, 256, 256, 512]
      activation: "tanh"
  dropout: 0.0
  batch_norm: false
  output_width: 9
  output_activation: "identity"

non_stationary_feature_extractor:
  name: "non_stationary"
  architecture:
    - layers: [64, 64]
      activation: "tanh"
    - layers: [64]
      activation: "relu"
    - layers: [64, 64, 64]
      activation: "tanh"
  dropout: 0.0
  batch_norm: false
  output_activation: "softplus"
  sigma_floor: 1e-6
  lengthscale_floor: 1e-6
  lengthscale_mode: "per_dimension"

kernel:
  type: "exponential"
  theta: 0.01
  power_exponent: 1.99
  likelihood_noise: 1e-3
  # tau2 is only used by the DKL architecture (ScaleKernel outputscale).
  # The non_stationary kernel encodes amplitude through sigma(x) and ignores this value.
  tau2: 1.0

trend_degree: 1
