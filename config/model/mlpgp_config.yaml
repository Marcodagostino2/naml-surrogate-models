# ============================================================================
# Hybrid MLP+Kriging Model Configuration
# ============================================================================
# Explicit MLPGP configuration.
#
# feature_extractor controls the MLP that outputs local kernel parameters:
#   - sigma(x): local amplitude factor
#   - l(x): local lengthscale (scalar or per-dimension)
#
# kernel keeps the stationary kernel hyperparameters separate and explicit:
#   - theta
#   - power_exponent
#   - nugget
#
# The likelihood noise is fixed to a minimal value (1e-6) to satisfy
# GPyTorch internal requirements, while all regularization comes from the nugget.

feature_extractor:
  architecture:
  - layers: [16, 16, 16]
    activation: "tanh"
  dropout: 0.0
  batch_norm: false
  output_activation: "softplus"
  sigma_floor: 1e-8
  lengthscale_floor: 1e-8
  lengthscale_mode: "per_dimension"

kernel:
  type: "exponential"
  theta: 1.0
  power_exponent: 2.0
  nugget: 0.01
  likelihood_noise: 1e-6

trend_degree: 1
