# ============================================================================
# Gaussian Process (Kriging) Model Configuration
# ============================================================================
# Explicit GP kernel configuration.
#
# The kernel is organized as:
#   K(x, x') = tau^2 * k_stationary(x, x')
# where k_stationary is the anisotropic generalized exponential kernel.
#
# The three kernel parameters are kept separate and explicit:
#   - theta: anisotropy weights per input dimension
#   - power_exponent: exponent per input dimension
#   - nugget: relative diagonal nugget inside the kernel
#
# The likelihood noise is fixed to a minimal value (1e-6) to satisfy
# GPyTorch internal requirements, while all regularization comes from the nugget.

kernel:
  type: "exponential"
  theta: 0.5
  power_exponent: 1.8
  tau2: 0.02
  likelihood_noise: 1e-5

# Polynomial trend degree (0 = constant, 1 = linear, 2 = quadratic)
trend_degree: 1
