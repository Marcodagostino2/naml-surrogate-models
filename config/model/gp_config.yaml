# ============================================================================
# Gaussian Process (Kriging) Model Configuration
# ============================================================================
# Explicit GP kernel configuration.
#
# Supported kernels:
#   - "exponential": Anisotropic generalized exponential (learnable theta, power_exponent)
#   - "rbf": Radial basis function (RBF) kernel
#   - "matern": Matern kernel (nu=0.5|1.5|2.5)
#
# Exponential kernel:
#   K(x, x') = tau^2 * k_stationary(x, x')
#   theta: anisotropy weights per input dimension
#   power_exponent: exponent per input dimension
#
# The likelihood noise is fixed to satisfy GPyTorch internal requirements.

kernel:
  type: "exponential"       # options: "exponential" | "rbf" | "matern"
  theta_init: 1.0e-1
  power_exponent_init: 1.99
  tau2_init: 1.0e-2
  likelihood_noise_init: 1.0e-2
  matern_nu: 2.5           # only used if type="matern" (options: 0.5, 1.5, 2.5)
  likelihood_noise_floor: 1.0e-6      # minimum noise level
  likelihood_noise_ceiling: 1.0       # maximum noise level 
  theta_floor: 1.0e-5      # minimum theta value 
  theta_ceiling: 1.0e3     # maximum theta value 
  power_exponent_floor: 1.5  # minimum power exponent
  power_exponent_ceiling: 2.0  # maximum power exponent

# Polynomial trend degree (0 = constant, 1 = linear, 2 = quadratic)
trend_degree: 1
