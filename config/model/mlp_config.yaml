# MLP architecture: a list of (layer_sizes, activation) blocks. Each block
# applies the same activation to every layer in its `layers` list. The final
# linear projection to output_dim and the `output_activation` are appended
# automatically.
architecture:
  - layers: [1024, 1024, 1024]
    activation: "tanh"
  - layers: [128]
    activation: "tanh"
  - layers: [256]
    activation: "tanh"

dropout: 0.03
batch_norm: false
# "identity" for regression
output_activation: "identity"
