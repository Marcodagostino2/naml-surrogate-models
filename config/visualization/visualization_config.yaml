# ============================================================================
# Visualization Configuration
# ============================================================================
# Controls the additive visualization layer added on top of training.

save_plots: true
output_dir: plots/
random_seed: 42

parity:
  enabled: true
  show_residuals: true

surface:
  enabled: true
  n_top_features: 2
  n_grid_points: 50
  pca_n_components: 3
  pca_n_other_samples: 50

uncertainty_gp:
  enabled: true

table:
  enabled: true
  split: test
