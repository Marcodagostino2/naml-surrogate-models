# ============================================================================
# Visualization Configuration
# ============================================================================
# Controls the additive visualization layer added on top of training.

save_plots: true
output_dir: plots/
random_seed: 42

parity:
  enabled: true
  show_residuals: true
  show_mape: true

surface:
  enabled: true
  n_top_features: 2
  n_grid_points: 50

uncertainty_gp:
  enabled: true

table:
  enabled: true
  split: test

# Single-run plot dimension selection. Names below MUST match either the CSV
# column names (input_columns in dataset_config.yaml) or the matching
# input_display_names entries — both resolve to the same dimension index.
#
# - slice_dims        : input names plotted as 1D slices. Empty = auto (top variance).
# - heatmap_dim_pair  : two names for the 2D heatmap. Empty = use first two slice dims.
# - locked_values     : value used for non-plotted inputs. Missing keys fall back
#                       to the median of the training data.
single_run:
  slice_dims: []
  heatmap_dim_pair: []
  locked_values: {}

optimization:
  enabled: true

convergence:
  enabled: true

# HYDDB-specific physics plots (active only when dataset is HYDDB_v2 / HYDDB_v3).
# Locked values must cover every input column not used as the axis or the
# parameter of a given plot — missing entries raise ValueError at plot time.
hyddb:
  enabled: true
  enable_3d: true
  n_grid_points: 60        # for the 2D / 3D Mach x alpha mesh
  n_sweep_points: 80       # for 1D sweeps
  mach_range:  [0.3, 1.8]
  alpha_range: [0.0, 10.0]
  phi_range:   [0.0, 120.0]
  abk_curves:  [0.0, 20.0, 40.0, 60.0, 80.0, 100.0]
  mach_curves: [0.5, 0.8, 1.0, 1.2, 1.5, 1.8]
  # Required by every HYDDB plot for the inputs it does not sweep / parameterize.
  locked_values:
    sim_machNumberValue:        1.0
    sim_aoaValue:               0.0
    sim_phiValue:               0.0
    sim_altitudeValue:          5000.0
    geom_abk_openingPercentage: 0.0
