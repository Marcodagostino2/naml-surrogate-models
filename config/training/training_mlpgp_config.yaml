# ============================================================================
# Hybrid MLP+Kriging Training Configuration
# ============================================================================
# Joint training settings for the end-to-end MLP+Kriging hybrid model.
#
# The model can use:
# - objective: "concentrated" (profile out trend and tau^2 when feasible)
# - objective: "exact_mll" (fallback / standard objective)
#
# MLP and GP kernel parameters are optimized jointly.

# Optimizer: "adam", "sgd", "adamw"
optimizer: "adam"

# Objective: "concentrated" or "exact_mll"
objective: "concentrated"

# Learning rates (can be different for MLP and GP components)
mlp_learning_rate: 0.001
gp_learning_rate: 0.05

# Number of joint training steps
n_training_steps: 200

# Convergence criteria
abs_tol: 1e-5
rel_tol: 1e-3

# Convergence check frequency
convergence_check_interval: 10

# Device: "cuda", "cpu", "auto"
device: "auto"

# Checkpointing
save_checkpoint_every_n_steps: 20
