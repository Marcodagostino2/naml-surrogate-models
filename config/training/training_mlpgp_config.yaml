# Joint MLP+GP training (full-batch, EMLL maximization).
# "epoch" in shared keys (warmup_epochs, *_patience) means optimization step
# here, since training has no mini-batches.

# "adam" | "adamw" | "sgd"
optimizer: "adamw"

# Distinct learning rates: feature extractor typically wants a faster LR than
# kernel hyperparameters; weight decay only applied to the MLP side.
mlp_learning_rate: 1.0e-3
gp_learning_rate: 1.0e-3
mlp_weight_decay: 1.0e-6

n_training_steps: 700

# Two stop criteria, same as GP trainer (logical OR). val_patience is more
# permissive: the joint loss landscape lets val loss plateau transiently while
# MLP and kernel rebalance.
rel_tol: 1.0e-4
abs_tol: 1.0e-6
train_patience: 50
val_patience: 400
warmup_epochs: 30

train_metrics_log_interval: 10
validation_check_interval: 10

device: "auto"

force_cholesky: true
cg_max_iterations: 1000
cholesky_jitter_float32: 1.0e-6
cholesky_jitter_float64: 1.0e-8

save_checkpoint_every_n_steps: 20

# SVGP-only knobs (used when model_cfg.inference == "svgp").
svgp_n_epochs: 200
svgp_batch_size: 1024
