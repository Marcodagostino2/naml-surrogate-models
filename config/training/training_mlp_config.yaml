# MLP training (mini-batch SGD).

optimizer: "adamw"
learning_rate: 1.0e-4
weight_decay: 1.0e-4
n_epochs: 2000

# Early-stopping tolerances (see ConvergenceMonitor).
rel_tol: 1.0e-4
abs_tol: 1.0e-6
train_patience: 200
val_patience: 400
warmup_epochs: 400

train_metrics_log_interval: 10
validation_check_interval: 10

# "mse" | "mae" | "huber"
loss_function: "mse"
device: "auto"
