# ============================================================================
# MLP Training Configuration
# ============================================================================
# Training hyperparameters specific to the standalone MLP.

# Optimizer: "adam", "sgd", "adamw"
optimizer: "adamw"

# Learning rate
learning_rate: 1.0e-4

# Weight_decay 
weight_decay: 1.0e-4 

# Number of epochs (kept large; training stops early when tolerances are met)
n_epochs: 700

# Stop policy
train_residual_check_interval: 10
train_residual_tol: 1.0e-4
validation_check_interval: 10
validation_residual_tol: 1.0e-4

# Loss function: "mse", "mae", "huber"
loss_function: "mse"

# Device: "cuda", "cpu", "auto"
device: "auto"

# Checkpointing
save_checkpoint_every_n_epochs: 10
