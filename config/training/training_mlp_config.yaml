# ============================================================================
# MLP Training Configuration
# ============================================================================
optimizer: "adamw"
learning_rate: 1.0e-4
weight_decay: 1.0e-4
n_epochs: 700

# Stop policy (convergence-based)
rel_tol: 1.0e-4         # relative tolerance on loss change / val improvement
abs_tol: 1.0e-6         # absolute tolerance (handles loss values near zero)
train_patience: 50       # consecutive epochs with |dL| <= tol to call it converged
val_patience: 50        # consecutive epochs without val improvement to stop
warmup_epochs: 10       # don't evaluate stop criteria before this epoch

# Logging cadence
train_metrics_log_interval: 10
validation_check_interval: 10

loss_function: "mse"
device: "auto"
save_checkpoint_every_n_epochs: 10