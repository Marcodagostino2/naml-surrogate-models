# Defaults shared by all trainers; per-model files override what differs.

# LR scheduler: "steplr" | "cosine" | "none"
scheduler_type: cosine

# StepLR knobs (used when scheduler_type == "steplr")
scheduler_step_size: 200
scheduler_gamma: 0.5

# Cosine annealing knobs (used when scheduler_type == "cosine")
# T_max defaults to n_training_steps / n_epochs when null.
scheduler_T_max: null
scheduler_eta_min: 1.0e-7
