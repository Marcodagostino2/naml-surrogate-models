# User-friendly config for convergence_analysis.py.
# split_percentages accepts either fractions [0,1] or percentages [0,100].

mode: "optimization"  # "analysis" or "optimization"

global_seed: 21

split_percentages: [0.7] # Train split grid.
validation_train_ratio: 0.2  # Validation uses a fixed ratio of the training split.

# Number of runs to perform for each model.
# Used for both analysis mode and the post-optimization uncertainty retrains.
runs_per_model:
  mlp: 5
  gp: 5
  mlpgp: 5

# Random kernel-initialization bounds for the GP-family models.
# The script samples one value per parameter within the configured bounds.
kernel_init_bounds:
  gp:
    type: "exponential"
    theta_init: {low: 1.0e-3, high: 1.0e-1}
    power_exponent_init: {low: 1.5, high: 2.0}
    tau2_init: {low: 1.0e-4, high: 1.0e-1}
    likelihood_noise_init: {low: 1.0e-5, high: 1.0e-2}
    matern_nu: {low: 0.5, high: 2.5}
  mlpgp:
    type: "exponential"
    theta_init: {low: 1.0e-3, high: 1.0e-1}
    power_exponent_init: {low: 1.5, high: 2.0}
    tau2_init: {low: 1.0e-4, high: 1.0e-1}
    likelihood_noise_init: {low: 1.0e-5, high: 1.0e-2}
    matern_nu: {low: 0.5, high: 2.5}

# Optional overrides for the optimization mode.
# These settings are merged into config/optimization/*.yaml at runtime.
optimization_overrides:
  study:
    # n_trials accepts either an int (applied to every model) or a dict
    # per-model with optional 'default' fallback.
    n_trials:
      mlp: 100
      gp: 10
      mlpgp: 200
    timeout: 7200
    metric: "val_rmse"
    sampler: "tpe"
    pruner: "median"
    n_startup_trials: 5
    n_warmup_steps: 15
    pruner_interval: 5
    log_every_n_trials: 5
