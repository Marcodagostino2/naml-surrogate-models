# Convergence sweep configuration for the train_ratio study.
# This file is intentionally separate from the main training config so you can
# tune the sweep without affecting the baseline experiment settings.

# Ratios to evaluate. If left empty, the script falls back to its internal default list.
train_ratios:
  - 0.15
  - 0.25
  - 0.35
  - 0.45
  - 0.55
  - 0.65
  - 0.75

# Root folder where sweep outputs are written.
output_dir: outputs/convergence_analysis

# Optional seed for reproducibility. If null, the script reuses the training or dataset seed.
seed: 42

# Optional overrides for the existing config paths.
dataset_config: config/dataset_config.yaml
model_config: config/model_config.yaml
training_config: config/training_config.yaml
visualization_config: config/visualization_config.yaml