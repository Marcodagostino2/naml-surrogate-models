# Optional display names used in plot axes/titles.
# If a variable is missing here, its raw name is used.
# Example:
# labels:
#   sim_machNumberValue: Mach [-]
#   sim_aoaValue: AoA [deg]
#   cfd_cfx: Cfx [-]
labels: {"sim_machNumberValue": "Mach [-]", 
          "sim_aoaValue": "AoA [deg]", 
          "geom_abk_openingPercentage": "abk [%]",
          "cfd_cfx": "Cfx [-]"}

diagnostics:
  parity:
    # Scatter style and on-plot metrics in parity charts.
    # point_size = marker area (matplotlib s) in points^2.
    # point_alpha = marker transparency in [0,1] (0 transparent, 1 opaque).
    point_size: 20
    point_alpha: 0.7
    annotate_metrics: true
    metrics_decimals: 5

  residuals:
    # Histogram bins for residual distribution.
    bins: 30

  percent_error:
    # Error in percent: 100 * abs(pred - true) / max(abs(true), epsilon)
    enabled: true
    epsilon: 1.0e-8
    # Vertical markers at these sample percentiles.
    percentiles: [50, 80, 90, 95]
    # Text box: percent of samples with APE <= threshold.
    error_thresholds_percent: [1, 2, 5, 10]

sweeps:
  enabled: true

  # Which outputs to sweep. Use "all" or a list of output names/indices.
  # Example: [cfd_cfx] or [0]
  targets: all

  # Number of grid points for each plot family.
  num_points_1d: 200
  num_points_2d: 80
  num_points_3d: 32

  # How frozen dimensions are set when plotting sweeps.
  # Options: median, mean, midrange
  freeze_strategy: median

  # Optional explicit overrides for frozen defaults.
  # Example:
  # freeze_values:
  #   sim_aoaValue: 0.0
  #   geom_abk_openingPercentage: 50.0
  freeze_values: {}

  include_training_points: true
  max_training_points_overlay: 1500

  generate_1d: true
  generate_2d_contour: true
  generate_3d_surface: true
