# Epoch budget for the training loop.
epochs: 2000
# Base learning rate passed to the selected optimizer.
learning_rate: 0.001
# L2 regularization strength. For AdamW this is decoupled weight decay.
weight_decay: 0.00001

# Optimizer used by the trainer. Supported values: adam, adamw, sgd, rmsprop,
# adagrad, adadelta.
optimizer_name: adam

# Extra keyword arguments forwarded to the selected optimizer. Examples:
# sgd: { momentum: 0.9, nesterov: true }
# adam: { betas: [0.9, 0.999], eps: 1.0e-8 }
optimizer_kwargs: {}

# Stop early if validation loss does not improve for this many epochs.
early_stopping_patience: 100
# Enable tqdm-based progress visualization.
use_tqdm: true
# Progress style:
# - epoch: one live bar with train/val/best updates (recommended)
# - batch: detailed bars for train/val batches
# - off: no tqdm bars, only periodic text logs
progress_mode: epoch
# Print a compact status line every N epochs.
log_every_n_epochs: 1

# auto = use CUDA if available, otherwise CPU.
device: auto
# Global seed for reproducibility.
random_seed: 42

# Where outputs, checkpoints and reports are written.
output_dir: outputs/mlp_baseline
checkpoint_name: best_model.pt
history_name: history.json
artifacts_name: artifacts.pkl

# Generate parity, residual and physical sweep plots after training.
generate_plots: true

# Number of grid points for each physical sweep curve.
diagnostics_num_points: 200